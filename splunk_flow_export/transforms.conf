# Splunk transforms.conf for NDR Egress Service (SNA 7.6.1)
# Place this file in: $SPLUNK_HOME/etc/system/local/transforms.conf
# or in your Splunk App: $SPLUNK_HOME/etc/apps/<your_app>/local/transforms.conf

# Optional: filter events to auto-assign sourcetype based on known FC flow pattern
# This matches the first field being a hostname followed by a numeric flow_id
[ndr_egress_sourcetype_filter]
REGEX = ^[^,]+,\d+,\d+,
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::svc_ndr_adapter_flow


# Alternative: manual field extraction using DELIMS
# Use this stanza if INDEXED_EXTRACTIONS is not available on your Splunk version
[ndr_egress_csv_fields]
DELIMS = ","
FIELDS = hostname,flow_id,sequence_num,client_total_bytes,client_total_packets,server_total_bytes,server_total_packets,total_bytes,client_ip,server_ip,fc_ip,client_tls_version,start_active_usec,last_active_usec,client_group_list,server_group_list,client_payload,server_payload,protocol,flow_sensor_app_id,client_mac,server_mac,client_port,server_port,client_num_bytes,server_num_bytes,client_num_packets,server_num_packets,client_xlate_ip,server_xlate_ip,client_xlate_port,server_xlate_port,vlan_id,username,client_exporters,server_exporters,client_interfaces,server_interfaces
