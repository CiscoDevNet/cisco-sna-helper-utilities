# Splunk props.conf for NDR Egress Service (SNA 7.6.1)
# Place this file in: $SPLUNK_HOME/etc/system/local/props.conf
# or in your Splunk App: $SPLUNK_HOME/etc/apps/<your_app>/local/props.conf
#
# This sourcetype handles CSV flow records exported by the NDR Egress Service.
# Field order matches CSV_FIELDS defined in svc_ndr_adapter source code.

[svc_ndr_adapter_flow]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = csv
FIELD_NAMES = hostname,flow_id,sequence_num,client_total_bytes,client_total_packets,server_total_bytes,server_total_packets,total_bytes,client_ip,server_ip,fc_ip,client_tls_version,start_active_usec,last_active_usec,client_group_list,server_group_list,client_payload,server_payload,protocol,flow_sensor_app_id,client_mac,server_mac,client_port,server_port,client_num_bytes,server_num_bytes,client_num_packets,server_num_packets,client_xlate_ip,server_xlate_ip,client_xlate_port,server_xlate_port,vlan_id,username,client_exporters,server_exporters,client_interfaces,server_interfaces
HEADER_MODE = none
TIME_FORMAT = %s%6N
TIME_PREFIX = start_active_usec=
MAX_TIMESTAMP_LOOKAHEAD = 20
TRANSFORMS-ndr_egress = ndr_egress_sourcetype_filter
